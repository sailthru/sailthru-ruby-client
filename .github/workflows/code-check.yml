name: Code Quality Check

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Check runtime compatibility every Monday at 04:37 UTC.
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ruby ${{ matrix.ruby == 'ruby' && 'current' || matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The engine-only "ruby" alias follows the latest stable MRI release.
        ruby: ['3.3', '3.4', 'ruby']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby and install dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Test and smoke-test the packaged client
        run: bundle exec rake verify
